# Repo jest publiczne, wiec ArgoCD klonuje je po HTTPS anonimowo — zaden
# sekret z poswiadczeniami nie jest potrzebny (patrz repo-secret.example.yaml).
#   kubectl apply -f k3s/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: na-fali
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shugopl/na-fali.git
    targetRevision: HEAD
    path: k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: na-fali
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
