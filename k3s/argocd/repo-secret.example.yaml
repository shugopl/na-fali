# NIEUZYWANE. Repo `shugopl/na-fali` jest publiczne, a `application.yaml` klonuje je
# po HTTPS — ArgoCD nie potrzebuje zadnego poswiadczenia. Ten szablon zostaje na
# wypadek powrotu repo do prywatnego; wtedy trzeba tez zmienic `repoURL` na SSH.
#
# Gdy repo jest prywatne, ArgoCD musi miec klucz, zeby je sklonowac.
# NIE commituj wypelnionej wersji — to sekret.
#
# 1. wygeneruj klucz:      ssh-keygen -t ed25519 -f ./na-fali-deploy -N ''
# 2. klucz PUBLICZNY (.pub) dodaj w GitHubie:
#    Settings -> Deploy keys -> Add deploy key  (read-only wystarczy)
# 3. klucz PRYWATNY wstaw do klastra:
#
#    kubectl -n argocd create secret generic na-fali-repo \
#      --from-literal=type=git \
#      --from-literal=url=git@github.com:shugopl/na-fali.git \
#      --from-file=sshPrivateKey=./na-fali-deploy
#    kubectl -n argocd label secret na-fali-repo \
#      argocd.argoproj.io/secret-type=repository
#
# Ponizej ten sam sekret w formie deklaratywnej (sshPrivateKey do uzupelnienia):
apiVersion: v1
kind: Secret
metadata:
  name: na-fali-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:shugopl/na-fali.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----
