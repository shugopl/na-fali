apiVersion: apps/v1
kind: Deployment
metadata:
  name: na-fali
  namespace: na-fali
  labels:
    app.kubernetes.io/name: na-fali
spec:
  # SQLite na wolumenie RWO -> jedna instancja, brak rolling update.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: na-fali
  template:
    metadata:
      labels:
        app.kubernetes.io/name: na-fali
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001            # zeby proces mogl pisac do PVC
      # Pakiet ghcr.io/shugopl/na-fali jest prywatny; sekret tworzony recznie,
      # celowo poza gitem (repo jest publiczne) — patrz README.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: na-fali
          # Te linie nadpisuje CI (.github/workflows/deploy.yml) po kazdym buildzie —
          # nie edytuj taga recznie, zostanie zastapiony.
          image: ghcr.io/shugopl/na-fali:9716035c91fbad1437a77fcc68ab6bd4e56d2f57
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /data/course.sqlite3
            # Serwer odrzuca zadania o nieznanym naglowku Host (ochrona przed
            # DNS rebinding), wiec domena musi byc tu wymieniona.
            - name: ALLOWED_HOSTS
              value: na-fali.shugo.com.pl
            # TLS konczy sie na Cloudflare, origin mowi czystym HTTP — serwer nie
            # jest w stanie sam wywnioskowac, ze cookie sesji ma miec flage Secure.
            - name: SECURE_COOKIES
              value: "1"
            # Kod wymagany przy rejestracji. Sekret tworzy sie recznie i celowo nie
            # ma go w gicie (repo publiczne); brak sekretu = rejestracja otwarta.
            # Ziarno kodu zaproszenia przy pierwszym starcie; potem rzadzi panel admina.
            - name: REGISTRATION_CODE
              valueFrom:
                secretKeyRef: { name: na-fali-registration, key: code, optional: true }
          # Sekrety reczne, poza gitem (repo publiczne). Klucze = nazwy zmiennych:
          #   na-fali-mail:  SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD SMTP_FROM
          #   na-fali-admin: ADMIN_EMAIL ADMIN_PASSWORD  (bootstrap konta administratora)
          # Bez na-fali-mail kody weryfikacyjne trafiaja tylko do logow poda.
          envFrom:
            - secretRef: { name: na-fali-mail, optional: true }
            - secretRef: { name: na-fali-admin, optional: true }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: na-fali-data
        - name: tmp
          emptyDir: {}
